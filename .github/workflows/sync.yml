name: sync
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
concurrency: sync
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Durumu al
        run: |
          REMOTE="${REMOTE:-https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}"
          rm -rf state
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch data "$REMOTE" state
          else
            mkdir state; git -C state init -q -b data; git -C state remote add origin "$REMOTE"
          fi
          if [ -s state/data.json ] && grep -q '"seats":{"' state/data.json && [ ! -f state/private.enc ]; then
            echo "UYARI: data.json dolu ama private.enc yok. Durum kaybı olmaması için durduruldu."; exit 1
          fi
          if [ -f state/data.json ]; then cp state/data.json data.json; fi
          if [ -f state/private.enc ]; then node state.js dec; fi
      - name: Senkronize et
        run: node sync.js
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          VERIFIED_CSV_URL: ${{ secrets.VERIFIED_CSV_URL }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          COMMENT_KEYWORD: ${{ secrets.COMMENT_KEYWORD }}
          SALT: ${{ secrets.SALT }}
      - name: Durumu kaydet
        run: |
          REMOTE="${REMOTE:-https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}"
          node state.js enc
          cp data.json state/data.json
          cd state
          git config user.name "amfi-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan tmp
          git add -A
          git commit -q -m "sync $(date -u +%FT%TZ)"
          git branch -M data
          git push -q -f "$REMOTE" data
