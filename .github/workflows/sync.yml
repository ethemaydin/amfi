name: sync
# Instagram yorum/DM -> takip doğrulama -> masa atama -> data.json
# Durum: şifreli olarak data branch'inde tutulur (FTP'ye ihtiyaç yok).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Kuru çalışma (hiç DM gönderme)"
        type: boolean
        default: false
concurrency: sync
permissions: { contents: write }
env:
  GH_TOKEN: ${{ github.token }}
  STATE_KEY: ${{ secrets.STATE_KEY }}
  SITE: ${{ secrets.SITE_URL || 'https://amfi.englishbase.com.tr' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Testler (sahte API, mesaj yok)
        run: node test.js

      - name: Durumu al (data branch)
        run: bash scripts/pull.sh

      - name: Senkronize et
        run: node sync.js
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SALT: ${{ secrets.SALT }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          API_VERSION: ${{ secrets.API_VERSION }}
          API_MODE: ${{ secrets.API_MODE }}
          COMMENT_KEYWORD: ${{ secrets.COMMENT_KEYWORD }}
          MEDIA_IDS: ${{ secrets.MEDIA_IDS }}
          VERIFIED_CSV_URL: ${{ secrets.VERIFIED_CSV_URL }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://amfi.englishbase.com.tr' }}
          TOTAL: ${{ secrets.TOTAL || '50000' }}
          STEP: ${{ secrets.STEP || '10000' }}
          REQUIRE_COMMENT: ${{ secrets.REQUIRE_COMMENT || '0' }}
          AUTO_DM: ${{ secrets.AUTO_DM || '1' }}
          MAX_SEND: ${{ secrets.MAX_SEND || '60' }}
          MAX_CALLS: ${{ secrets.MAX_CALLS || '150' }}
          RECHECK: ${{ secrets.RECHECK || '12' }}
          MAX_CONV_PAGES: ${{ secrets.MAX_CONV_PAGES || '3' }}
          CONV_LIMIT: ${{ secrets.CONV_LIMIT || '25' }}
          LOG_EVENTS: ${{ secrets.LOG_EVENTS || '1' }}
          WARN_CD: ${{ secrets.WARN_CD || '360' }}
          MSG_ASK: ${{ secrets.MSG_ASK }}
          MSG_BTN: ${{ secrets.MSG_BTN }}
          MSG_OK: ${{ secrets.MSG_OK }}
          MSG_NO: ${{ secrets.MSG_NO }}
          VERBOSE: ${{ secrets.VERBOSE }}
          DRY: ${{ inputs.dry && '1' || '0' }}

      - name: Durumu kaydet (data branch)
        if: ${{ !inputs.dry }}
        run: bash scripts/push.sh

      - name: Siteyi doğrula
        if: ${{ !inputs.dry }}
        run: |
          set -uo pipefail
          L=$(node -e "const d=require('./data.json');console.log(Object.keys(d.seats).length)")
          R=$(curl -sS --max-time 25 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/data.json?t=$GITHUB_RUN_ID" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Object.keys(JSON.parse(s).seats).length)}catch(e){console.log('okunamadi')}})")
          echo "Yerel masa: $L · Sitede görünen: $R"
          [ "$R" = "$L" ] || echo "::warning::Site farklı sayı gösteriyor (raw CDN ~5 dk gecikebilir)."

      - name: Özet
        if: always()
        run: |
          echo "### sync" >> "$GITHUB_STEP_SUMMARY"
          node -e "const s=require('fs').existsSync('data.json')?require('fs').readFileSync('data.json','utf8'):'{}';const d=JSON.parse(s);console.log('- dolu masa: '+Object.keys(d.seats||{}).length+'\n- kazanan: '+(d.winners||[]).length+'\n- güncelleme: '+(d.updated||'-'))" >> "$GITHUB_STEP_SUMMARY"